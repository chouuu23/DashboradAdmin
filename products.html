<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoodDash Admin - Products</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        .gradient-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .sidebar-item-active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            box-shadow: 0 8px 16px rgba(102, 126, 234, 0.3);
        }

        .glass-effect {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }

        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1f5f9;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 10px;
        }

        .table-row {
            transition: all 0.2s ease;
        }

        .table-row:hover {
            background: linear-gradient(90deg, rgba(102, 126, 234, 0.05) 0%, rgba(118, 75, 162, 0.05) 100%);
            transform: scale(1.005);
        }

        .search-box {
            transition: all 0.3s ease;
        }

        .search-box:focus {
            box-shadow: 0 4px 20px rgba(102, 126, 234, 0.2);
            transform: scale(1.02);
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            transition: all 0.3s ease;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        .btn-danger {
            transition: all 0.2s ease;
        }

        .btn-danger:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3);
        }

        .product-image {
            transition: all 0.3s ease;
        }

        .product-image:hover {
            transform: scale(1.1) rotate(3deg);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-fade-in {
            animation: fadeIn 0.6s ease-out forwards;
        }

        .stock-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.375rem;
            padding: 0.375rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 700;
        }

        .stock-high {
            background: #dcfce7;
            color: #15803d;
        }

        .stock-medium {
            background: #fef3c7;
            color: #a16207;
        }

        .stock-low {
            background: #fee2e2;
            color: #991b1b;
        }

        .price-tag {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 12px;
            font-weight: 800;
            box-shadow: 0 4px 12px rgba(79, 172, 254, 0.3);
        }
    </style>
</head>

<body class="bg-gradient-to-br from-slate-50 via-purple-50 to-blue-50">

    <div class="flex h-screen overflow-hidden">

        <!-- SIDEBAR -->
        <aside class="w-72 glass-effect flex flex-col shrink-0 shadow-2xl">
            <div class="p-8">
                <div class="flex items-center gap-3">
                    <div class="gradient-bg p-3 rounded-2xl shadow-lg">
                        <span class="text-2xl">⚡</span>
                    </div>
                    <div>
                        <h1
                            class="text-xl font-black tracking-tight bg-gradient-to-r from-purple-600 to-blue-600 bg-clip-text text-transparent">
                            FOODDASH</h1>
                        <p class="text-xs text-slate-500 font-medium">Admin Portal</p>
                    </div>
                </div>
            </div>

            <nav class="flex-1 px-4 space-y-2 custom-scrollbar overflow-y-auto">
                <a href="index.html"
                    class="flex items-center gap-3 px-5 py-4 rounded-2xl text-sm font-medium text-slate-700 hover:bg-white hover:shadow-md transition-all">
                    <span class="text-xl">📊</span>
                    <span>Dashboard</span>
                </a>
                <a href="products.html"
                    class="sidebar-item-active flex items-center gap-3 px-5 py-4 rounded-2xl text-sm font-semibold transition-all">
                    <span class="text-xl">🛍</span>
                    <span>Products</span>
                </a>
                <a href="table-bookings.html"
                    class="flex items-center gap-3 px-5 py-4 rounded-2xl text-sm font-medium text-slate-700 hover:bg-white hover:shadow-md transition-all">
                    <span class="text-xl">📅</span>
                    <span>Table Bookings</span>
                </a>
                <a href="user-accounts.html"
                    class="flex items-center gap-3 px-5 py-4 rounded-2xl text-sm font-medium text-slate-700 hover:bg-white hover:shadow-md transition-all">
                    <span class="text-xl">👤</span>
                    <span>User Accounts</span>
                </a>
                <a href="payments.html"
                    class="flex items-center gap-3 px-5 py-4 rounded-2xl text-sm font-medium text-slate-700 hover:bg-white hover:shadow-md transition-all">
                    <span class="text-xl">💳</span>
                    <span>Payments</span>
                </a>
            </nav>

            <div class="p-6 border-t border-slate-200">
                <button onclick="logout()"
                    class="flex items-center gap-3 w-full px-5 py-3 rounded-xl text-sm font-semibold text-red-500 hover:bg-red-50 transition-all">
                    <span class="text-xl">⏻</span>
                    <span>Logout</span>
                </button>
            </div>
        </aside>

        <!-- MAIN -->
        <main class="flex-1 flex flex-col overflow-hidden">

            <!-- HEADER -->
            <header class="h-24 glass-effect border-b border-white/50 px-8 flex items-center justify-between shadow-sm">
                <div class="flex-1 max-w-xl">
                    <input id="productSearch" type="text" placeholder="🔍 Search products by name..."
                        class="search-box w-full px-6 py-3 bg-white rounded-2xl text-sm outline-none border border-slate-200 font-medium">
                </div>

                <button onclick="addProduct()"
                    class="btn-primary text-white px-6 py-3 rounded-2xl font-bold text-sm flex items-center gap-2 shadow-lg">
                    <span class="text-lg">➕</span>
                    Add Product
                </button>
            </header>

            <!-- CONTENT -->
            <div class="flex-1 overflow-y-auto p-8 custom-scrollbar">

                <div class="max-w-7xl mx-auto">
                    <!-- HEADER SECTION -->
                    <div class="mb-8 animate-fade-in">
                        <h2 class="text-3xl font-black text-slate-800 mb-2">Product Catalog 🛍️</h2>
                        <p class="text-slate-600">Manage your restaurant's menu items and inventory</p>
                    </div>

                    <!-- PRODUCTS TABLE -->
                    <div class="bg-white rounded-3xl shadow-lg border border-white/50 overflow-hidden animate-fade-in"
                        style="animation-delay: 0.1s">
                        <div class="overflow-x-auto">
                            <table class="w-full">
                                <thead class="bg-gradient-to-r from-slate-50 to-purple-50">
                                    <tr>
                                        <th
                                            class="px-8 py-5 text-left text-xs font-black text-slate-600 uppercase tracking-wider">
                                            Preview</th>
                                        <th
                                            class="px-8 py-5 text-left text-xs font-black text-slate-600 uppercase tracking-wider">
                                            Product Details</th>
                                        <th
                                            class="px-8 py-5 text-left text-xs font-black text-slate-600 uppercase tracking-wider">
                                            Price</th>
                                        <th
                                            class="px-8 py-5 text-left text-xs font-black text-slate-600 uppercase tracking-wider">
                                            Stock Status</th>
                                        <th
                                            class="px-8 py-5 text-right text-xs font-black text-slate-600 uppercase tracking-wider">
                                            Actions</th>
                                    </tr>
                                </thead>

                                <tbody id="productsTable" class="divide-y divide-slate-100"></tbody>
                            </table>
                        </div>

                        <!-- EMPTY STATE -->
                        <div id="emptyState" class="hidden py-16 text-center">
                            <div class="text-6xl mb-4">🍽️</div>
                            <h3 class="text-xl font-bold text-slate-700 mb-2">No products found</h3>
                            <p class="text-slate-500">Start by adding your first product to the catalog</p>
                        </div>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <script>
        const API_BASE = "https://lychou19.pythonanywhere.com/api";
        const TOKEN = localStorage.getItem("access_token");

        if (!TOKEN) {
            window.location.href = "login.html";
        }

        // LOGOUT
        function logout() {
            localStorage.clear();
            window.location.href = "login.html";
        }

        // ADD PRODUCT (placeholder)
        function addProduct() {
            alert("Add Product feature - Coming soon!");
        }

        // GET STOCK STATUS
        function getStockStatus(stock) {
            if (stock >= 20) return { class: 'stock-high', icon: '✓', text: `${stock} in stock` };
            if (stock >= 10) return { class: 'stock-medium', icon: '⚠', text: `${stock} in stock` };
            return { class: 'stock-low', icon: '!', text: stock > 0 ? `Only ${stock} left` : 'Out of stock' };
        }

        // FETCH PRODUCTS
        fetch(`${API_BASE}/products/`, {
            headers: {
                "Authorization": `Bearer ${TOKEN}`
            }
        })
            .then(res => {
                if (res.status === 401) {
                    logout();
                    throw new Error("Unauthorized");
                }
                return res.json();
            })
            .then(products => {
                const tbody = document.getElementById("productsTable");
                const emptyState = document.getElementById("emptyState");

                tbody.innerHTML = "";

                if (products.length === 0) {
                    emptyState.classList.remove("hidden");
                    return;
                }

                products.forEach(p => {
                    const productId = p.id ?? p.product_id ?? p.pk;

                    const stock = p.stock ?? 0;
                    const stockStatus = getStockStatus(stock);
                    const imageUrl = p.image || 'https://via.placeholder.com/80/667eea/ffffff?text=🍽️';

                    tbody.innerHTML += `
        <tr class="table-row">
            <td class="px-8 py-5">
                <img src="${imageUrl}"
                     alt="${p.name}"
                     class="product-image w-16 h-16 rounded-2xl object-cover shadow-md border-2 border-white"
                     onerror="this.src='https://via.placeholder.com/80/667eea/ffffff?text=🍽️'">
            </td>

            <td class="px-8 py-5">
                <div class="font-bold text-slate-800 text-base mb-1">${p.name}</div>
                <div class="text-xs text-slate-500 font-medium">ID: #${productId}</div>

            </td>

            <td class="px-8 py-5">
                <span class="price-tag">$${Number(p.price).toFixed(2)}</span>
            </td>

            <td class="px-8 py-5">
                <span class="stock-badge ${stockStatus.class}">
                    <span>${stockStatus.icon}</span>
                    <span>${stockStatus.text}</span>
                </span>
            </td>

            <td class="px-8 py-5 text-right">
    <div class="flex items-center justify-end gap-2">

        <button
            onclick="editProduct(${productId})"
            class="px-4 py-2 bg-blue-50 text-blue-600 rounded-xl font-semibold text-sm hover:bg-blue-100 transition-all">
            ✏️ Edit
        </button>

        <button
            onclick="deleteProduct(${productId}, this)"
            class="btn-danger px-4 py-2 bg-red-50 text-red-600 rounded-xl font-semibold text-sm hover:bg-red-100">
            🗑️ Delete
        </button>

    </div>
</td>

        </tr>`;
                });
            })
            .catch(err => console.error(err));

        // SEARCH
        document.getElementById("productSearch").addEventListener("input", e => {
            const q = e.target.value.toLowerCase();
            const rows = document.querySelectorAll("#productsTable tr");
            let visibleCount = 0;

            rows.forEach(row => {
                const isVisible = row.innerText.toLowerCase().includes(q);
                row.style.display = isVisible ? "" : "none";
                if (isVisible) visibleCount++;
            });

            // Show empty state if no results
            const emptyState = document.getElementById("emptyState");
            if (visibleCount === 0 && q !== "") {
                emptyState.classList.remove("hidden");
                emptyState.innerHTML = `
            <div class="text-6xl mb-4">🔍</div>
            <h3 class="text-xl font-bold text-slate-700 mb-2">No products found</h3>
            <p class="text-slate-500">Try adjusting your search terms</p>
        `;
            } else if (visibleCount > 0) {
                emptyState.classList.add("hidden");
            }
        });

        // EDIT PRODUCT (placeholder)
        function editProduct(id) {
            alert(`Edit Product #${id} - Coming soon!`);
        }

        // DELETE PRODUCT
        function deleteProduct(id, btn) {
            if (!confirm("Are you sure you want to delete this product? This action cannot be undone.")) return;

            fetch(`${API_BASE}/admin/products/${id}/`, {   // ✅ admin endpoint
                method: "DELETE",
                headers: {
                    "Authorization": `Bearer ${TOKEN}`
                }
            })
                .then(res => {
                    if (res.status === 204 || res.ok) {
                        const row = btn.closest('tr');        // ✅ safe DOM reference
                        row.style.opacity = "0";
                        setTimeout(() => row.remove(), 300);  // ✅ no reload needed
                    } else {
                        alert("Failed to delete product. Please try again.");
                    }
                })
                .catch(err => {
                    console.error(err);
                    alert("An error occurred while deleting the product.");
                });
        }

    </script>

</body>

</html>
