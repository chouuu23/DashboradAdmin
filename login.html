<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - FoodDash Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        .gradient-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .glass-effect {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .input-focus {
            transition: all 0.3s ease;
        }

        .input-focus:focus {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(61, 90, 254, 0.15);
        }

        .btn-hover {
            transition: all 0.3s ease;
        }

        .btn-hover:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(61, 90, 254, 0.3);
        }

        .floating {
            animation: floating 3s ease-in-out infinite;
        }

        @keyframes floating {

            0%,
            100% {
                transform: translateY(0px);
            }

            50% {
                transform: translateY(-10px);
            }
        }

        .fade-in {
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(70px);
            opacity: 0.5;
            animation: blob 7s infinite;
        }

        @keyframes blob {

            0%,
            100% {
                transform: translate(0, 0) scale(1);
            }

            33% {
                transform: translate(30px, -50px) scale(1.1);
            }

            66% {
                transform: translate(-20px, 20px) scale(0.9);
            }
        }

        .blob-1 {
            top: -100px;
            left: -100px;
            width: 300px;
            height: 300px;
            background: #667eea;
        }

        .blob-2 {
            bottom: -100px;
            right: -100px;
            width: 250px;
            height: 250px;
            background: #764ba2;
            animation-delay: 2s;
        }
    </style>
</head>

<body class="gradient-bg min-h-screen flex items-center justify-center p-4 relative overflow-hidden">

    <!-- Animated Background Blobs -->
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>

    <div class="w-full max-w-md relative z-10 fade-in">

        <!-- Logo & Header -->
        <div class="text-center mb-8">
            <div
                class="inline-flex items-center justify-center w-20 h-20 bg-white rounded-3xl shadow-2xl mb-6 floating">
                <svg class="w-12 h-12 text-[#667eea]" fill="currentColor" viewBox="0 0 24 24">
                    <path
                        d="M11 9H9V2H7V9H5V2H3V9C3 11.12 4.66 12.84 6.75 12.97V22H9.25V12.97C11.34 12.84 13 11.12 13 9V2H11V9ZM16 6V14H18.5V22H21V2H16C16 4.21 16 6 16 6Z" />
                </svg>
            </div>
            <h1 class="text-4xl font-bold text-white mb-3">Welcome Back</h1>
            <p class="text-white/80 text-lg">Manage your FoodDash store with ease</p>
        </div>

        <!-- Login Form Card -->
        <div class="glass-effect p-10 rounded-3xl shadow-2xl border border-white/20">
            <form id="loginForm" class="space-y-6">

                <!-- Username Input -->
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-3">Username</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                            <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                            </svg>
                        </div>
                        <input id="email" type="text" placeholder="Enter your username"
                            class="input-focus w-full pl-12 pr-4 py-4 bg-gray-50 border-2 border-gray-200 rounded-2xl text-sm focus:outline-none focus:border-[#667eea] focus:bg-white"
                            required>
                    </div>
                </div>

                <!-- Password Input -->
                <div>
                    <div class="flex justify-between items-center mb-3">
                        <label class="text-sm font-semibold text-gray-700">Password</label>
                        <a href="#" class="text-xs text-[#667eea] font-bold hover:underline transition-all">Forgot
                            Password?</a>
                    </div>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                            <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z">
                                </path>
                            </svg>
                        </div>
                        <input id="password" type="password" placeholder="Enter your password"
                            class="input-focus w-full pl-12 pr-4 py-4 bg-gray-50 border-2 border-gray-200 rounded-2xl text-sm focus:outline-none focus:border-[#667eea] focus:bg-white"
                            required>
                    </div>
                </div>

                <!-- Remember Me Checkbox -->
                <div class="flex items-center justify-between">
                    <div class="flex items-center gap-3">
                        <input type="checkbox" id="remember"
                            class="w-5 h-5 rounded-lg border-2 border-gray-300 text-[#667eea] focus:ring-2 focus:ring-[#667eea] focus:ring-offset-0 cursor-pointer">
                        <label for="remember" class="text-sm text-gray-600 font-medium cursor-pointer">Remember
                            me</label>
                    </div>
                </div>

                <!-- Submit Button -->
                <button type="submit"
                    class="btn-hover w-full py-4 bg-gradient-to-r from-[#667eea] to-[#764ba2] text-white rounded-2xl font-bold text-base shadow-lg">
                    Sign In to Dashboard
                </button>
            </form>

            <!-- Divider -->
            <div class="mt-8 pt-6 border-t border-gray-200 text-center">
                <div class="flex items-center justify-center gap-2">
                    <svg class="w-4 h-4 text-gray-400" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4z"></path>
                    </svg>
                    <p class="text-xs text-gray-500 font-medium">Secure Admin Access Only</p>
                </div>
            </div>
        </div>

        <!-- Footer -->
        <p class="text-center mt-8 text-sm text-white/70">© 2025 FoodDash Dashboard. All rights reserved.</p>
    </div>

    <script>
        const form = document.getElementById("loginForm");

        form.addEventListener("submit", async (e) => {
            e.preventDefault();

            const username = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value.trim();
            const btn = e.target.querySelector("button");

            btn.disabled = true;
            btn.textContent = "Signing in...";

            try {
                const res = await fetch("https://lychou19.pythonanywhere.com/api/login/", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ username, password })
                });

                const data = await res.json();

                if (!res.ok) {
                    throw new Error(data.error || "Invalid credentials");
                }

                localStorage.setItem("access_token", data.access);
                localStorage.setItem("refresh_token", data.refresh);
                localStorage.setItem("admin_name", data.username);

                window.location.href = "index.html";

            } catch (err) {
                alert(err.message);
            } finally {
                btn.disabled = false;
                btn.textContent = "Sign In";
            }
        });

    </script>

</body>

</html>
